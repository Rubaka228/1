<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Iron Man WebXR HUD - Pure HUD Trace Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #020617; font-family: 'Rajdhani', sans-serif; user-select: none; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .scanlines {
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0, 240, 255, 0.03) 50%, rgba(0, 240, 255, 0.03));
            background-size: 100% 4px;
        }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden bg-slate-950 scanlines">
    <div id="webgl-container" class="absolute inset-0 w-full h-full z-0 cursor-grab active:cursor-grabbing"></div>
    <div id="vr-lens-overlay" class="pointer-events-none absolute inset-0 z-5 opacity-0 transition-opacity duration-500 bg-[radial-gradient(circle_at_center,transparent_45%,rgba(2,6,23,0.75)_80%,rgba(2,6,23,0.98)_100%)] border-[10px] border-slate-900/60 rounded-3xl"></div>

    <div id="desktop-ui" class="pointer-events-none absolute inset-0 z-20 flex flex-col justify-between p-6">
        <div class="flex justify-between items-center pointer-events-auto">
            <div class="bg-slate-900/80 backdrop-blur-md px-5 py-2.5 rounded-xl border border-sky-500/50 shadow-[0_0_20px_rgba(56,189,248,0.3)]">
                <h1 class="font-orbitron font-extrabold text-sky-400 text-sm tracking-widest">MARK LXXXV // HUD-ONLY TRACE SIMULATION</h1>
                <p class="text-xs text-slate-400 font-mono">F.R.I.D.A.Y. VIRTUAL UI VECTOR ACTIVE</p>
            </div>
            <div class="flex items-center gap-3">
                <button id="audio-toggle" class="bg-slate-900/80 hover:bg-slate-800 text-sky-400 border border-sky-500/40 px-4 py-2 rounded-xl text-xs font-orbitron transition">SOUND: ON</button>
                <div class="bg-slate-900/80 backdrop-blur-md px-4 py-2 rounded-xl border border-amber-500/40 text-right">
                    <span id="vr-status-badge" class="text-xs font-orbitron text-amber-400 font-bold animate-pulse">WEBXR READY</span>
                </div>
            </div>
        </div>
        <div id="vr-btn-container" class="self-center pointer-events-auto flex flex-col items-center gap-3 mb-4"></div>
    </div>

    <script>
        class HUDSoundEffects {
            constructor() { this.ctx = null; this.enabled = true; }
            init() {
                if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; this.ctx = new AC(); }
                if (this.ctx.state === 'suspended') this.ctx.resume();
            }
            playTone(freq, type, duration, vol = 0.15) {
                if (!this.enabled) return;
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            playLockSound() { this.playTone(1400, 'square', 0.05, 0.15); setTimeout(() => this.playTone(2100, 'triangle', 0.12, 0.22), 50); }
            playScanChirp() { this.playTone(800, 'sine', 0.03, 0.06); }
            playJarvisTone() { this.playTone(520, 'sine', 0.08, 0.12); setTimeout(() => this.playTone(1040, 'sine', 0.14, 0.15), 80); }
        }
        const audio = new HUDSoundEffects();

        let scene, camera, renderer;
        let targets = [], lockedTarget = null;
        let targetLockReticleGroup, outerLockRing, innerLockRing;
        let hudCardMesh, hudCardCanvas, hudCardCtx;
        let isMouseDown = false, lon = 0, lat = 0;
        let onPointerDownPointerX = 0, onPointerDownPointerY = 0, onPointerDownLon = 0, onPointerDownLat = 0;
        let isVrSimulated = false;

        let currentHudLocalX = 0.28;
        let currentHudLocalY = 0.0;

        function init() {
            const container = document.getElementById('webgl-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020617, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 1000);
            camera.position.set(0, 1.6, 0);
            scene.add(camera);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            renderer.setClearColor(0x020617, 1);
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0x00f0ff, 0.6));
            const dirLight = new THREE.DirectionalLight(0xff6600, 1.0);
            dirLight.position.set(10, 20, 15);
            scene.add(dirLight);

            scene.add(new THREE.GridHelper(300, 60, 0x00f0ff, 0x1e293b)).position.y = -4;

            createFloatingTargets();
            createDynamicTargetLockReticle();
            createCameraSpaceHUD();
            setupWebXR();
            setupDesktopControls();

            window.addEventListener('resize', onWindowResize);
            renderer.setAnimationLoop(animate);

            document.getElementById('audio-toggle').addEventListener('click', (e) => {
                audio.enabled = !audio.enabled;
                e.target.innerText = `SOUND: ${audio.enabled ? 'ON' : 'OFF'}`;
            });
        }

        function createDynamicTargetLockReticle() {
            targetLockReticleGroup = new THREE.Group();
            outerLockRing = new THREE.Mesh(new THREE.RingGeometry(1.6, 1.8, 32), new THREE.MeshBasicMaterial({ color: 0xef4444, side: THREE.DoubleSide, transparent: true, opacity: 0.9 }));
            targetLockReticleGroup.add(outerLockRing);
            innerLockRing = new THREE.Mesh(new THREE.RingGeometry(0.8, 0.95, 4), new THREE.MeshBasicMaterial({ color: 0xff6600, side: THREE.DoubleSide, transparent: true, opacity: 0.95 }));
            targetLockReticleGroup.add(innerLockRing);
            targetLockReticleGroup.visible = false;
            scene.add(targetLockReticleGroup);
        }

        function createCameraSpaceHUD() {
            hudCardCanvas = document.createElement('canvas');
            hudCardCanvas.width = 512;
            hudCardCanvas.height = 350; // Чуть увеличили по высоте под имитацию трейса
            hudCardCtx = hudCardCanvas.getContext('2d');

            const texture = new THREE.CanvasTexture(hudCardCanvas);
            const geometry = new THREE.PlaneGeometry(0.40, 0.27); 
            const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide, depthTest: false });

            hudCardMesh = new THREE.Mesh(geometry, material);
            hudCardMesh.visible = false;
            hudCardMesh.renderOrder = 999;
            
            // Карточка крепится прямо к камере (на визор)
            camera.add(hudCardMesh);
            hudCardMesh.position.set(currentHudLocalX, currentHudLocalY, -0.8);
        }

        // Рендерим инфо-карточку вместе с виртуальным симулированным трейсом прямо на текстуре
        function updateHUDCanvasTexture(data) {
            const ctx = hudCardCtx;
            ctx.clearRect(0, 0, 512, 350);

            // Основная панель
            ctx.fillStyle = 'rgba(2, 6, 23, 0.92)';
            ctx.fillRect(0, 0, 512, 300);

            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 6;
            ctx.strokeRect(0, 0, 512, 300);

            // Уголки
            ctx.fillStyle = '#ff6600';
            ctx.fillRect(0, 0, 35, 12); ctx.fillRect(0, 0, 12, 35);
            ctx.fillRect(512 - 35, 0, 35, 12); ctx.fillRect(512 - 12, 0, 12, 35);
            ctx.fillRect(0, 300 - 12, 35, 12); ctx.fillRect(0, 300 - 35, 12, 35);
            ctx.fillRect(512 - 35, 300 - 12, 35, 12); ctx.fillRect(512 - 12, 300 - 35, 12, 35);

            ctx.textAlign = 'left';
            ctx.font = 'bold 32px Orbitron, sans-serif';
            ctx.fillStyle = '#ef4444';
            ctx.fillText(data.label || 'TARGET LOCKED', 30, 55);

            ctx.font = 'bold 18px Orbitron, monospace';
            ctx.fillStyle = '#ff6600';
            ctx.fillText('/// TELEMETRY ACTIVE ///', 30, 90);

            ctx.strokeStyle = 'rgba(239, 68, 68, 0.4)';
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(30, 105); ctx.lineTo(482, 105); ctx.stroke();

            ctx.font = '24px Rajdhani, monospace';
            ctx.fillStyle = '#94a3b8';
            ctx.fillText('DISTANCE:', 30, 160);
            ctx.fillStyle = '#00f0ff';
            ctx.font = 'bold 28px Orbitron, sans-serif';
            ctx.fillText(`${data.dist} M`, 180, 160);

            ctx.font = '24px Rajdhani, monospace';
            ctx.fillStyle = '#94a3b8';
            ctx.fillText('MATERIAL:', 30, 215);
            ctx.fillStyle = '#e2e8f0';
            ctx.font = 'bold 24px Orbitron, sans-serif';
            ctx.fillText(data.comp, 180, 215);

            const progress = (data.time * 40) % 100;
            ctx.fillStyle = 'rgba(239, 68, 68, 0.2)';
            ctx.fillRect(30, 240, 452, 28);
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(30, 240, 452 * (progress / 100), 28);

            ctx.font = 'bold 18px Orbitron, sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.fillText(`ANALYZING... ${Math.floor(progress)}%`, 256, 260);

            // --- ВИЗУАЛЬНАЯ ИМИТАЦИЯ ТРЕЙСА (ПИКСЕЛЬНАЯ ПАЛКА ВНУТРИ HUD) ---
            // Рисуем красивый векторный отросток, который уходит от нижнего угла панели к реальному положению цели на экране
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 4;
            ctx.shadowColor = '#00f0ff';
            ctx.shadowBlur = 10;

            const startX = (data.isLeft) ? 0 : 512; // Нижний угол карточки
            const startY = 300;
            
            // Направление имитации основывается на реальном смещении координат дрона в пространстве визора
            const endX = startX + (data.relX * -250); 
            const endY = 350 + (data.relY * 150);

            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);
            ctx.stroke();

            // Точка на конце имитируемого луча
            ctx.fillStyle = '#00f0ff';
            ctx.beginPath(); ctx.arc(endX, endY, 6, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;

            hudCardMesh.material.map.needsUpdate = true;
        }

        function createFloatingTargets() {
            const targetPositions = [
                { x: -10, y: 3, z: -15, label: 'DRONE ALPHA', comp: 'TITANIUM ALLOY' },
                { x: 12, y: 5, z: -18, label: 'SATELLITE B-9', comp: 'CARBON COMPOSITE' },
                { x: 0, y: 6, z: -12, label: 'UNIDENTIFIED', comp: 'UNKNOWN METEORIC' }
            ];

            targetPositions.forEach((pos, idx) => {
                const group = new THREE.Group();
                group.position.set(pos.x, pos.y, pos.z);
                const mesh = new THREE.Mesh(new THREE.OctahedronGeometry(1.2, 0), new THREE.MeshStandardMaterial({ color: 0x020617, emissive: 0xef4444, emissiveIntensity: 0.6, wireframe: true }));
                group.add(mesh);
                const ring = new THREE.Mesh(new THREE.RingGeometry(1.6, 1.8, 16), new THREE.MeshBasicMaterial({ color: 0xef4444, side: THREE.DoubleSide, transparent: true, opacity: 0.7 }));
                group.add(ring);
                group.userData = { id: idx, label: pos.label, comp: pos.comp, initialY: pos.y, speed: 0.6 + Math.random() * 0.8, mesh, ring };
                scene.add(group);
                targets.push(group);
            });
        }

        function setupWebXR() {
            const container = document.getElementById('vr-btn-container');
            container.innerHTML = '';

            const createBtn = (text, onClick) => {
                const btn = document.createElement('button');
                btn.className = "bg-gradient-to-r from-sky-500 via-amber-500 to-sky-500 hover:from-sky-400 hover:to-amber-400 text-slate-950 font-orbitron font-black tracking-widest text-xs md:text-sm py-3 px-8 rounded-full shadow-[0_0_25px_rgba(56,189,248,0.8)] border border-sky-200 transition-all transform hover:scale-105 active:scale-95";
                btn.innerText = text;
                btn.addEventListener('click', onClick);
                container.appendChild(btn);
            };

            if ('xr' in navigator) {
                navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                    if (supported) {
                        createBtn("ENTER NATIVE VR", () => {
                            audio.playJarvisTone();
                            navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor'] }).then((session) => {
                                renderer.xr.setSession(session);
                                document.getElementById('vr-status-badge').innerText = "VR ACTIVE";
                            });
                        });
                    } else {
                        createBtn("START VR HUD MODE", toggleSimulatedVR);
                    }
                }).catch(() => createBtn("START VR HUD MODE", toggleSimulatedVR));
            } else {
                createBtn("START VR HUD MODE", toggleSimulatedVR);
            }
        }

        function toggleSimulatedVR() {
            audio.playJarvisTone();
            isVrSimulated = !isVrSimulated;
            document.getElementById('vr-lens-overlay').classList.toggle('opacity-0', !isVrSimulated);
            document.getElementById('vr-lens-overlay').classList.toggle('opacity-100', isVrSimulated);
            document.getElementById('vr-status-badge').innerText = isVrSimulated ? "SIMULATED VR" : "WEBXR READY";
        }

        function setupDesktopControls() {
            document.body.addEventListener('pointerdown', (e) => {
                if (e.target.closest('#desktop-ui') && e.target.tagName === 'BUTTON') return;
                isMouseDown = true;
                onPointerDownPointerX = e.clientX; onPointerDownPointerY = e.clientY;
                onPointerDownLon = lon; onPointerDownLat = lat;
                audio.playScanChirp();
            });
            document.addEventListener('pointermove', (e) => {
                if (!isMouseDown || renderer.xr.isPresenting) return;
                lon = (onPointerDownPointerX - e.clientX) * 0.12 + onPointerDownLon;
                lat = (e.clientY - onPointerDownPointerY) * 0.12 + onPointerDownLat;
                lat = Math.max(-85, Math.min(85, lat));
            });
            document.addEventListener('pointerup', () => { isMouseDown = false; });
        }

        function checkGazeTargetLock(time) {
            const cameraDirection = new THREE.Vector3();
            camera.getWorldDirection(cameraDirection);

            let closestTarget = null, minAngle = Infinity;
            targets.forEach(target => {
                const angle = cameraDirection.angleTo(target.position.clone().sub(camera.position).normalize());
                if (angle < 0.65 && angle < minAngle) { minAngle = angle; closestTarget = target; }
            });

            if (closestTarget) {
                if (lockedTarget !== closestTarget) {
                    if (lockedTarget) {
                        lockedTarget.userData.mesh.material.emissive.setHex(0xef4444);
                        lockedTarget.userData.ring.material.color.setHex(0xef4444);
                    }
                    lockedTarget = closestTarget;
                    lockedTarget.userData.mesh.material.emissive.setHex(0xff6600);
                    lockedTarget.userData.ring.material.color.setHex(0xff6600);
                    audio.playLockSound();
                }

                targetLockReticleGroup.visible = true;
                targetLockReticleGroup.position.copy(lockedTarget.position);
                targetLockReticleGroup.lookAt(camera.position);

                const dist = camera.position.distanceTo(lockedTarget.position).toFixed(1);

                // Вычисляем относительное положение цели в поле зрения для имитации линии в интерфейсе
                const localTargetPos = lockedTarget.position.clone();
                camera.worldToLocal(localTargetPos);

                const hudZ = -0.8;
                const scale = hudZ / localTargetPos.z;
                const targetProjX = localTargetPos.x * scale;
                const targetProjY = localTargetPos.y * scale;

                const offsetX = (targetProjX >= 0) ? -0.32 : 0.32;
                const offsetY = -0.05;

                const targetHudX = THREE.MathUtils.clamp(targetProjX + offsetX, -0.45, 0.45);
                const targetHudY = THREE.MathUtils.clamp(targetProjY + offsetY, -0.35, 0.15);

                currentHudLocalX += (targetHudX - currentHudLocalX) * 0.2;
                currentHudLocalY += (targetHudY - currentHudLocalY) * 0.2;

                hudCardMesh.position.set(currentHudLocalX, currentHudLocalY, hudZ);
                hudCardMesh.visible = true;

                // Передаем в текстуру карточки относительное смещение для отрисовки виртуальной палки-трейса
                const relX = targetProjX - currentHudLocalX;
                const relY = targetProjY - currentHudLocalY;

                updateHUDCanvasTexture({
                    time,
                    label: lockedTarget.userData.label,
                    dist,
                    comp: lockedTarget.userData.comp,
                    isLeft: currentHudLocalX < 0,
                    relX,
                    relY
                });

            } else {
                if (lockedTarget) {
                    lockedTarget.userData.mesh.material.emissive.setHex(0xef4444);
                    lockedTarget = null;
                }
                targetLockReticleGroup.visible = false;
                hudCardMesh.visible = false;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate(timestamp) {
            const time = timestamp * 0.001;
            if (!renderer.xr.isPresenting && !isVrSimulated) {
                const phi = THREE.MathUtils.degToRad(90 - lat);
                const theta = THREE.MathUtils.degThread = THREE.MathUtils.degToRad(lon); // safe fallback
                const safeTheta = THREE.MathUtils.degToRad(lon);
                camera.lookAt(new THREE.Vector3(camera.position.x + 100 * Math.sin(phi) * Math.cos(safeTheta), camera.position.y + 100 * Math.cos(phi), camera.position.z + 100 * Math.sin(phi) * Math.sin(safeTheta)));
            }

            targets.forEach((t) => {
                t.position.y = t.userData.initialY + Math.sin(time * t.userData.speed) * 0.5;
                t.userData.mesh.rotation.x += 0.01;
                t.userData.ring.lookAt(camera.position);
            });

            checkGazeTargetLock(time);
            if (targetLockReticleGroup.visible) {
                outerLockRing.rotation.z = time * 3.5;
                innerLockRing.rotation.z = -time * 5.0;
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
